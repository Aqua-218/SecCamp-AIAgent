# Release stages are not gates: they run only on a semantic-version tag and are
# ordered rather than planned. Parity validation still requires both platforms
# to implement each one.
release_stages:
  - id: package
    title: Build and attest release
    github: package
    gitlab: package_release
  - id: verify
    title: Verify release assets
    github: verify
    gitlab: verify_release
  - id: publish
    title: Publish through the protected environment
    github: publish
    gitlab: publish_release
  - id: record
    title: Create the immutable release record
    why_platform: >-
      On GitHub the release record is the Release object that the publish stage
      creates, so a separate job could only repeat the publish. GitLab needs one
      call to upload assets and another to create the Release, and therefore has
      a job for each.
    github: null
    gitlab: create_release
