  - id: supervisor-negative-lifecycle
    component: supervisor
    scope: hosted
    status: unverified
    summary: Remaining supervisor lifecycle risk is concentrated in multi-phase cleanup combinations, concurrent authority changes during setup, permanent-record bounds, and deliberately unreachable token combinations.
    verification_page: docs/supervisor/verification.md
    prerequisites:
      - id: supervisor-failure-matrix
        description: A negative lifecycle matrix must exercise every cleanup and protocol error with caller identity preserved.
        check: supervisor failure and protocol boundary test matrix
    gate:
      id: supervisor-negative-lifecycle
      result: required
      on_prerequisite_failure: fail
      commands:
        - cargo test --locked -p supervisor --all-targets
    evidence:
