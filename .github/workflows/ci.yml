name: Continuous Integration
run-name: CI / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  pipeline_policy:
    name: Pipeline policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned pipeline linters
        run: scripts/ci/install-pipeline-tools.sh
      - name: Validate pipeline policy
        run: scripts/ci/validate-pipelines.sh
      - name: Prove both platforms implement the same gates
        run: scripts/ci/check-pipeline-parity.sh

  pipeline_self_test:
    name: Pipeline script self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned pipeline linters
        run: scripts/ci/install-pipeline-tools.sh
      - name: Exercise the planner against known inputs
        run: scripts/ci/test-pipeline-planner.sh

  adr_index:
    name: Decision record index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check the decision log against its index
        run: scripts/ci/check-adr-index.sh

  verification_traceability:
    name: Verification page traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check every crate declares its unverified boundaries
        run: scripts/ci/check-verification-traceability.sh

  codeowners_coverage:
    name: CODEOWNERS coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check the gate-defining paths still require review
        run: scripts/ci/check-codeowners-coverage.sh

  repository_hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check tracked file modes, sizes, and endings
        run: scripts/ci/check-repository-hygiene.sh

  lean_hygiene:
    name: Lean proof hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reject proof holes and axioms
        run: scripts/ci/check-lean-hygiene.sh

  pin_inventory:
    name: Pin inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Collect every pinned version and digest
        run: scripts/ci/collect-pin-inventory.sh
      - name: Upload the inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin-inventory
          path: reports/pin-inventory.txt
          if-no-files-found: error
          retention-days: 14

  crate_isolation:
    name: Per-crate isolation build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Build each crate alone and hold the dependency floor
        run: scripts/ci/check-crate-isolation.sh

  cross_targets:
    name: Cross-target check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Type-check every declared target
        run: scripts/ci/run.sh cross-targets

  release_dry_run:
    name: Release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install release tools
        run: scripts/ci/install-release-tools.sh
      - name: Rehearse the release without publishing
        run: scripts/ci/run.sh release-dry-run

  reproducibility:
    name: Release reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install release tools
        run: scripts/ci/install-release-tools.sh
      - name: Build the release archive twice and compare the bytes
        run: scripts/ci/run.sh reproducibility

  docs_policy:
    name: Documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check documentation policy
        run: scripts/ci/run.sh docs-policy

  toolchain_consistency:
    name: Toolchain consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check that every pinned toolchain agrees
        run: scripts/ci/check-toolchain-consistency.sh

  dependency_usage:
    name: Declared dependency usage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check that every declared dependency is used
        run: scripts/ci/check-dependency-usage.sh

  lockfile_integrity:
    name: Lockfile integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check the lockfile against the manifests
        run: scripts/ci/check-lockfile-integrity.sh

  rust_quality:
    name: Rust quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Check formatting
        run: scripts/ci/run.sh format
      - name: Check all targets
        run: scripts/ci/run.sh check
      - name: Run Clippy
        run: scripts/ci/run.sh clippy
      - name: Build documentation
        run: scripts/ci/run.sh docs

  rust_tests:
    name: Rust tests / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust and nextest
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: nextest
      - name: Run test shard
        run: scripts/ci/run.sh test "${{ matrix.shard }}"
      - name: Upload JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-rust-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

  rust_doctests:
    name: Rust doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Run doctests
        run: scripts/ci/run.sh doctest

  loom:
    name: Loom concurrency model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Explore bounded interleavings
        run: scripts/ci/run.sh loom

  lean_proofs:
    name: Lean proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up Lean
        uses: ./.github/actions/setup-lean
      - name: Build Lean proofs
        run: scripts/ci/run.sh lean

  differential_corpus:
    name: Rust and Lean differential corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up Lean
        uses: ./.github/actions/setup-lean
      - name: Compare Rust and Lean decisions
        run: scripts/ci/run.sh differential

  coverage:
    name: Workspace coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust coverage tooling
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: coverage
      - name: Generate coverage reports
        run: scripts/ci/run.sh coverage
      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  ci_complete:
    name: CI complete
    if: ${{ always() }}
    needs:
      - pipeline_policy
      - pipeline_self_test
      - docs_policy
      - adr_index
      - verification_traceability
      - codeowners_coverage
      - repository_hygiene
      - lean_hygiene
      - pin_inventory
      - crate_isolation
      - toolchain_consistency
      - dependency_usage
      - lockfile_integrity
      - rust_quality
      - rust_tests
      - rust_doctests
      - loom
      - lean_proofs
      - differential_corpus
      - coverage
      - cross_targets
      - release_dry_run
      - reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce all quality gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<< "${NEEDS_JSON}"
