[workspace]
members = [
    "crates/authority-core",
    "crates/capfs",
    "crates/egress-broker",
    "crates/egress-protocol",
    "crates/firecracker-runtime",
    "crates/runtime-isolation",
    "crates/session-orchestrator",
    "crates/supervisor",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Aqua-218/SecCamp-AIAgent"
rust-version = "1.93.1"
version = "0.1.0-alpha.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
unsafe_op_in_unsafe_fn = "deny"
