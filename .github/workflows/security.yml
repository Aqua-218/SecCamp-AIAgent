name: Security Assurance
run-name: Security / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable ref whose code every gate must execute
        required: false
        type: string
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned pipeline parser
        run: scripts/ci/install-pipeline-tools.sh
      - name: Materialize the manifest-owned security plan
        id: plan
        env:
          PLAN_EVENT: ${{ github.event_name }}
          PLAN_PLATFORM: github
          PLAN_TIER: ${{ github.event_name == 'schedule' && 'deep' || 'standard' }}
        run: |
          set -euo pipefail
          scripts/ci/plan-pipeline.sh --workflow security.yml --output plan.json >/dev/null
          echo "gates=$(cat plan.json)" >> "${GITHUB_OUTPUT}"

  codeql:
    name: CodeQL Rust analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze Rust data flows
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:rust

  dependency_audit:
    name: RustSec advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up security tooling
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: security
      - name: Audit dependency advisories
        run: scripts/ci/run.sh audit
      - name: Upload audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit
          path: |
            reports/cargo-audit.json
            reports/cargo-audit-fuzz.json
          if-no-files-found: error
          retention-days: 30

  dependency_policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up security tooling
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: security
      - name: Enforce licenses and sources
        run: scripts/ci/run.sh deny
      - name: Upload dependency policy report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-deny
          path: |
            reports/cargo-deny.json
            reports/cargo-deny-fuzz.json
          if-no-files-found: error
          retention-days: 30

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Scan Rust security invariants
        run: |
          set -euo pipefail
          mkdir -p -- reports
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            docker.io/semgrep/semgrep:1.172.0@sha256:a8298d1c09c84b9a0bbc75ec915e37023fc4657360b6dbfa645261d2353a366c \
            semgrep scan --config .semgrep.yml --error --metrics off \
            --exclude target --exclude lean/.lake \
            --json-output reports/semgrep.json crates
      - name: Upload SAST report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sast
          path: reports/semgrep.json
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Secret detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history
        run: |
          set -euo pipefail
          mkdir -p -- reports
          docker run --rm \
            --volume "${PWD}:/repo" \
            --workdir /repo \
            docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --report-format sarif \
            --report-path reports/gitleaks.sarif .
      - name: Upload secret detection report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks
          path: reports/gitleaks.sarif
          if-no-files-found: error
          retention-days: 30

  supply_chain_inventory:
    name: Supply-chain inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install release tools
        run: scripts/ci/install-release-tools.sh
      - name: Record everything the lockfile resolves to
        run: scripts/ci/run.sh supply-chain-inventory
      - name: Upload the workspace SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-sbom
          path: |
            reports/workspace-sbom.spdx.json
            reports/fuzz-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare report directory
        run: mkdir -p -- reports
      - name: Analyze repository supply-chain posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: reports/scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard
          path: reports/scorecard.sarif
          if-no-files-found: error
          retention-days: 30

  security_complete:
    name: Security complete
    if: ${{ always() }}
    needs:
      - plan
      - codeql
      - dependency_audit
      - dependency_policy
      - sast
      - secrets
      - supply_chain_inventory
      - scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out fan-in implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Reconcile observed jobs with the manifest plan
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' '${{ needs.plan.outputs.gates }}' > plan.json
          scripts/ci/collect-gate-results.sh --from-needs --output results.tsv >/dev/null
          scripts/ci/check-gate-results.sh --plan plan.json --results results.tsv
