[package]
name = "egress-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
authority-core = { path = "../authority-core" }
egress-protocol = { path = "../egress-protocol" }
percent-encoding = "2.3.1"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde_json = "1.0.145"
socket2 = { version = "0.6.5", features = ["all"] }
url = "2.5.7"
zeroize = "1.9.0"
