[package]
name = "supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
authority-core = { path = "../authority-core" }
runtime-isolation = { path = "../runtime-isolation" }

[target.'cfg(target_os = "linux")'.dependencies]
capfs = { path = "../capfs" }
fuser = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "mount", "net", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
