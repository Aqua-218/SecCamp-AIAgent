version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:17"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    groups:
      rust-patch-updates:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:47"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, ci]
