    residual_reasons: []

  - id: runtime-isolation-architecture
    component: runtime-isolation
    scope: privileged
    status: blocked
    summary: The syscall-number and audit-architecture policy supports x86_64 and aarch64, but no completed privileged aarch64 runner result currently establishes the alternate-architecture boundary.
    verification_page: docs/runtime-isolation/verification.md
    prerequisites:
