[workspace]
members = ["crates/authority-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93.1"
version = "0.1.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
