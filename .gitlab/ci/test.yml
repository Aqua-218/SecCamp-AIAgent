rust_tests:
  extends: .rust_job
  stage: test
  timeout: 25m
  parallel:
    matrix:
      - SHARD: ["1"]
        PACKAGE: ["authority-core"]
      - SHARD: ["2"]
        PACKAGE: ["capfs"]
      - SHARD: ["3"]
        PACKAGE: ["egress-broker"]
      - SHARD: ["4"]
        PACKAGE: ["egress-protocol"]
      - SHARD: ["5"]
        PACKAGE: ["firecracker-runtime"]
      - SHARD: ["6"]
        PACKAGE: ["runtime-isolation"]
      - SHARD: ["7"]
        PACKAGE: ["session-orchestrator"]
      - SHARD: ["8"]
        PACKAGE: ["supervisor"]
  script:
    - scripts/ci/install-cargo-tools.sh nextest
    - scripts/ci/run.sh test-package "$PACKAGE"
  artifacts:
    when: always
    expire_in: 14 days
    access: developer
    paths:
      - target/nextest/ci/junit.xml
    reports:
      junit: target/nextest/ci/junit.xml

rust_doctests:
  extends: .rust_job
  stage: test
  timeout: 15m
  script:
    - scripts/ci/run.sh doctest

loom:
  extends: .rust_job
  stage: test
  timeout: 30m
  script:
    - scripts/ci/run.sh loom

lean_proofs:
  extends:
    - .rust_job
    - .lean_cache
  stage: test
  timeout: 30m
  script:
    - scripts/ci/install-lean.sh
    - scripts/ci/run.sh lean

differential_corpus:
  extends:
    - .rust_job
    - .lean_cache
  stage: test
  timeout: 30m
  script:
    - scripts/ci/install-lean.sh
    - scripts/ci/run.sh differential

coverage:
  extends: .rust_job
  stage: analyze
  timeout: 35m
  script:
    - scripts/ci/install-cargo-tools.sh coverage
    - scripts/ci/run.sh coverage
  coverage: '/TOTAL.*\s+([0-9]+\.[0-9]+%)/'
  artifacts:
    when: always
    expire_in: 14 days
    access: developer
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
