name: Deep verification
run-name: Deep / ${{ github.event_name }} / ${{ github.ref_name }}

# The protected deep evidence gates need hosts this project cannot rent from a
# hosted runner pool: one directly boots a real Firecracker guest-control VM,
# one drives Runtime::launch through the real jailer, one mounts CapFS through
# /dev/fuse, one exercises an isolated HTTPS fixture, one exercises the typed
# provider against an acknowledged disposable repository, and one applies the
# isolation transaction as root and asks the kernel what it enforces. None is
# allowed to report a skip as a pass: the evidence gates run on protected
# schedules or dispatches, while the mutating provider gate is dispatch-only.
# They are not attached to pull requests, where a missing device would either
# block every merge or teach everyone to ignore a yellow check.

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily, offset off the hour so the queue is not shared with every
    # other project's midnight cron.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: deep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  standard_quality:
    name: Re-run standard quality gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  standard_security:
    name: Re-run standard security gates
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      packages: read
      security-events: write

  plan:
    name: Plan deep gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned pipeline parser
        run: scripts/ci/install-pipeline-tools.sh
      - name: Materialize the manifest-owned deep plan
        id: plan
        env:
          PLAN_EVENT: ${{ github.event_name }}
          PLAN_PLATFORM: github
          PLAN_TIER: deep
        run: |
          set -euo pipefail
          scripts/ci/plan-pipeline.sh --workflow deep.yml --output plan.json >/dev/null
          echo "gates=$(cat plan.json)" >> "${GITHUB_OUTPUT}"

  miri:
    name: Miri undefined-behaviour check / ${{ matrix.package }} / ${{ matrix.filter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - package: authority-core
            filter: "capability::tests"
          - package: authority-core
            filter: "file::tests"
          - package: authority-core
            filter: "github::tests"
          - package: authority-core
            filter: "http::tests"
          - package: authority-core
            filter: "path::tests"
          - package: authority-core
            filter: "policy::tests"
          - package: authority-core
            filter: "repository::tests"
          - package: authority-core
            filter: "state::tests"
          - package: authority-core
            filter: "time::tests"
          - package: egress-protocol
            filter: "budget::tests"
          - package: egress-protocol
            filter: "cbor::tests"
          - package: egress-protocol
            filter: "frame::tests"
          - package: egress-protocol
            filter: "operation::tests"
          - package: egress-protocol
            filter: "session::tests"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust and pinned nightly components
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: miri
      - name: Run the supported pure Miri test subset
        run: scripts/ci/run.sh miri "${{ matrix.package }}" "${{ matrix.filter }}"

  sanitizers:
    name: Sanitizer run / ${{ matrix.mode }} / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: address
            package: egress-protocol
          - mode: leak
            package: egress-protocol
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust and pinned nightly components
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: sanitizers
      - name: Run the instrumented protocol test binary
        run: scripts/ci/run.sh sanitizers "${{ matrix.mode }}" "${{ matrix.package }}"

  mutation:
    name: Mutation testing / shard ${{ matrix.shard }} / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            package: authority-core
          - shard: 2
            package: egress-protocol
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust and cargo-mutants
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: mutation
      - name: Run the bounded decision-kernel mutation selection
        run: scripts/ci/run.sh mutation "${{ matrix.shard }}" "${{ matrix.package }}"

  fuzz:
    name: Fuzz targets / ${{ matrix.package }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - package: egress-protocol
            target: frame_decode
          - package: egress-protocol
            target: cbor_request_decode
          - package: authority-core
            target: canonical_path
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust, nightly, and cargo-fuzz
        uses: ./.github/actions/setup-rust
        with:
          tool-groups: fuzz
      - name: Fuzz the bounded parser target
        run: scripts/ci/run.sh fuzz "${{ matrix.package }}" "${{ matrix.target }}"

  benchmarks:
    name: Benchmark regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Run the capability decision benchmark against its baseline
        run: scripts/ci/run.sh benchmarks

  real_vm:
    name: Direct Firecracker guest-control verification
    # Requires /dev/kvm, /dev/vhost-vsock, and veritysetup. Runner labels are
    # repository configuration; docs/ci-cd.md records what the host must provide.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify guest control and Broker over a real microVM
        run: scripts/ci/verify-real-guest-control.sh

  real_runtime_lifecycle:
    name: Real Runtime lifecycle verification
    # Requires root, KVM, vhost-vsock, cgroup-v2, dm-verity, and the pinned
    # Firecracker jailer. A conditional skip is a fan-in failure when this gate
    # is required by the protected deep plan.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify Runtime::launch through the real jailer lifecycle
        run: scripts/ci/run.sh real-runtime-lifecycle

  real_runtime_version_matrix:
    name: Pinned Firecracker Runtime version matrix
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify production lifecycle across pinned Firecracker releases
        run: scripts/ci/run.sh real-runtime-version-matrix

  session_owner_kvm:
    name: Full SessionOwner KVM verification
    # Runs the production composition from clean snapshot capture through all
    # 13 CapFS effects, durable Broker evidence, stop, and resource cleanup.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify the full production SessionOwner lifecycle
        run: scripts/ci/run.sh real-session-owner

  session_owner_crash_recovery:
    name: SessionOwner external-crash recovery matrix
    # Each checkpoint is reached by the real KVM composition, killed by the
    # wrapper with SIGKILL, then reopened against the exact durable paths.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Kill and recover every durable SessionOwner lifecycle checkpoint
        run: scripts/ci/run.sh real-session-crash-recovery

  systemd_control_plane:
    name: Authenticated systemd control-plane verification
    # Uses real systemd, polkit, SO_PEERCRED, and an unprivileged controller.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify authenticated fixed-unit systemd composition and crash reconciliation
        run: scripts/ci/run.sh systemd-control-plane

  concurrent_session_owners:
    name: Concurrent SessionOwner KVM verification
    # Requires capacity for two production Firecracker guests at once.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify two concurrent production owners and independent cleanup
        run: scripts/ci/run.sh concurrent-session-owners

  installed_production_chain:
    name: Exact installed production-chain verification
    # Builds a clean snapshot bundle, installs the checked-in production units
    # on an ephemeral host, then exercises authenticated concurrent KVM workers.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, kvm, ephemeral]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify the exact installed controller-to-VM chain
        run: scripts/ci/run.sh installed-production-chain

  real_capfs:
    name: Real CapFS FUSE verification
    # Requires root and a readable/writable /dev/fuse. The gate is protected so
    # a hosted runner can never turn an unavailable mount boundary into green.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, privileged, ephemeral]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify CapFS through the host FUSE kernel boundary
        run: scripts/ci/run.sh real-capfs

  egress_real_https:
    name: Real public HTTPS verification
    # Requires root for isolated mount and network namespaces. This is a
    # disposable local HTTPS fixture, distinct from the protected live GitHub
    # mutation gate, which is restricted to on-demand dispatches below.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, privileged, ephemeral]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify DNS, TLS, SNI, and rebinding defenses
        run: scripts/ci/run.sh real-public-https

  external_provider_smoke:
    name: Protected external provider smoke
    # This job mutates only the explicitly acknowledged disposable repository.
    # The protected environment supplies all credential and object identities;
    # absent values make verify-live-github.sh fail before any request occurs.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_protected == true && github.event.repository.fork == false }}
    environment: external-provider-smoke
    runs-on: [self-hosted, linux, x64, ephemeral]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EGRESS_GITHUB_TOKEN: ${{ secrets.EGRESS_GITHUB_TOKEN }}
      EGRESS_GITHUB_INSTALLATION_ID: ${{ secrets.EGRESS_GITHUB_INSTALLATION_ID }}
      EGRESS_GITHUB_DISPOSABLE_REPOSITORY: ${{ secrets.EGRESS_GITHUB_DISPOSABLE_REPOSITORY }}
      EGRESS_GITHUB_BASE_BRANCH: ${{ secrets.EGRESS_GITHUB_BASE_BRANCH }}
      EGRESS_GITHUB_HEAD_BRANCH: ${{ secrets.EGRESS_GITHUB_HEAD_BRANCH }}
      EGRESS_GITHUB_EXPECTED_OLD_OBJECT: ${{ secrets.EGRESS_GITHUB_EXPECTED_OLD_OBJECT }}
      EGRESS_GITHUB_NEW_OBJECT: ${{ secrets.EGRESS_GITHUB_NEW_OBJECT }}
      EGRESS_GITHUB_DISPOSABLE_ACK: ${{ secrets.EGRESS_GITHUB_DISPOSABLE_ACK }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify the typed live GitHub provider path
        run: scripts/ci/run.sh live-github

  external_review_attestation:
    name: Independent review attestation
    # The report and key are injected by the protected environment. The
    # repository can validate an external signature but cannot create an
    # independent review of itself.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_protected == true && github.event.repository.fork == false }}
    environment: independent-review
    runs-on: [self-hosted, linux, x64, ephemeral]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXTERNAL_REVIEW_REPORT_B64: ${{ secrets.EXTERNAL_REVIEW_REPORT_B64 }}
      EXTERNAL_REVIEW_SIGNATURE_B64: ${{ secrets.EXTERNAL_REVIEW_SIGNATURE_B64 }}
      EXTERNAL_REVIEW_PUBLIC_KEY_B64: ${{ secrets.EXTERNAL_REVIEW_PUBLIC_KEY_B64 }}
      EXTERNAL_REVIEW_ARTIFACT_B64: ${{ secrets.EXTERNAL_REVIEW_ARTIFACT_B64 }}
      EXTERNAL_REVIEW_DISPOSITION_B64: ${{ secrets.EXTERNAL_REVIEW_DISPOSITION_B64 }}
      EXTERNAL_REVIEW_TRUSTED_KEY_SHA256: ${{ secrets.EXTERNAL_REVIEW_TRUSTED_KEY_SHA256 }}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify revision-bound external signature and disposition
        run: scripts/ci/run.sh external-review

  privileged_isolation:
    name: Privileged runtime isolation verification
    # Requires root and a cgroup v2 root that delegates memory and pids. No KVM.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, privileged, ephemeral]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Apply the 13 isolation steps and question the kernel
        run: scripts/ci/run.sh privileged-isolation

  privileged_isolation_aarch64:
    name: Privileged aarch64 runtime isolation verification
    # This must execute on a real aarch64 kernel. A cross-compiled artifact on
    # an x86_64 runner is deliberately rejected by the wrapper.
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, arm64, privileged, ephemeral]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Apply the architecture-bound isolation policy and question the kernel
        run: scripts/ci/run.sh privileged-isolation-aarch64

  runtime_isolation_soak:
    name: Privileged runtime isolation soak
    if: ${{ github.ref_protected == true && github.event.repository.fork == false }}
    runs-on: [self-hosted, linux, x64, privileged, ephemeral]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Repeat the full privileged boundary and escape corpus
        run: scripts/ci/run.sh runtime-isolation-soak

  deep_complete:
    name: Deep verification complete
    if: ${{ always() }}
    needs:
      - standard_quality
      - standard_security
      - plan
      - miri
      - sanitizers
      - mutation
      - fuzz
      - benchmarks
      - real_vm
      - real_runtime_lifecycle
      - real_runtime_version_matrix
      - session_owner_kvm
      - session_owner_crash_recovery
      - systemd_control_plane
      - concurrent_session_owners
      - installed_production_chain
      - real_capfs
      - egress_real_https
      - external_provider_smoke
      - external_review_attestation
      - privileged_isolation
      - privileged_isolation_aarch64
      - runtime_isolation_soak
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out fan-in implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reconcile observed jobs with the manifest plan
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e '.standard_quality.result == "success" and .standard_security.result == "success"' <<< "${NEEDS_JSON}"
          printf '%s\n' '${{ needs.plan.outputs.gates }}' > plan.json
          scripts/ci/collect-gate-results.sh --from-needs --output results.tsv >/dev/null
          scripts/ci/check-gate-results.sh --plan plan.json --results results.tsv
