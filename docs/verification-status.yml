      sources:
        - crates/supervisor/src/supervisor.rs
        - crates/supervisor/src/protocol.rs
      tests:
        - crates/supervisor/tests/supervisor.rs
    residual_reasons:
      - Stop-workload, remove-cgroup, close-handle, and simultaneous multi-phase cleanup failures are not all regression-locked through Supervisor.
      - Concurrent state changes between registration and workload start plus permanent subject/handle registry bounds remain unverified.
      - The unreachable workload/cgroup token branch has no public construction path or direct test.

