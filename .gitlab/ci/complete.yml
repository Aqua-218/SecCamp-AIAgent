pipeline_plan:
  stage: validate
  timeout: 10m
  script:
    - scripts/ci/install-pipeline-tools.sh
    - |
      case "${CI_PIPELINE_SOURCE}" in
        merge_request_event) plan_event=pull_request ;;
        schedule) plan_event=schedule ;;
        web) plan_event=workflow_dispatch ;;
        api) plan_event=api ;;
        push) if [[ -n "${CI_COMMIT_TAG:-}" ]]; then plan_event=tag; else plan_event=push; fi ;;
        *) plan_event="${CI_PIPELINE_SOURCE}" ;;
      esac
      PLAN_EVENT="${plan_event}" PLAN_PLATFORM=gitlab \
        scripts/ci/plan-pipeline.sh --output reports/pipeline-plan.json > /dev/null
  artifacts:
    expire_in: 14 days
    access: developer
    paths:
      - reports/pipeline-plan.json

# This job consumes the actual current-pipeline job set from GitLab. Matrix instances collapse to
# their manifest gate; a missing, failed, canceled, or unexpectedly executed gate then disagrees
# with the exact plan and fails before packaging or publication stages can begin.
pipeline_complete:
  stage: complete
  timeout: 10m
  when: always
  needs:
    - job: pipeline_plan
      artifacts: true
    - job: pipeline_policy
      artifacts: false
