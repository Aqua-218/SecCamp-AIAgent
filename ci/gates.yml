# Delivery gate manifest.
#
# This file is the single source of truth for the pipeline topology. Three
# repository-owned scripts read it, and nothing else is allowed to invent a gate:
#
#   scripts/ci/plan-pipeline.sh        decides which gates a given event must run
#   scripts/ci/check-pipeline-parity.sh proves GitHub and GitLab both implement them
#   scripts/ci/check-gate-results.sh  reconciles the executed plan with results
#
# A gate that exists in a workflow but not here fails parity validation, and a
# gate listed here that no platform implements fails it too. The manifest is the
# reason a platform migration cannot quietly drop a check.
#
# Gate fields
#   id            Stable identifier. The GitHub job id and the GitLab job name
#                 must both equal this string.
#   title         Human-readable name used in reports and job names.
#   stage         validate | quality | test | verify | analyze | delivery |
#                 security | system
#   tier          fast | standard | deep
#   scopes        Change scopes that make the gate relevant. A gate runs when any
#                 of its scopes changed, or when the event carries no diff.
#   events        Optional canonical pipeline events allowed to require this gate.
#                 Omit for every event; an event outside this list is `skipped`.
#   status        implemented | planned. See below; parity enforces both cases.
#   github        GitHub Actions job id, or `null` when the platform cannot host it.
#   gitlab        GitLab CI job name, or `null`.
#   workflow      GitHub workflow file that defines the job.
#   include       GitLab include file that defines the job.
#   matrix        Optional matrix key from `matrices` below, expanded by the planner.
#   why_platform  Required whenever `github` or `gitlab` is null on an implemented gate.
#   why_planned   Required on every planned gate. Says what is missing.
#
# Why `status` exists
#
# This manifest is the plan and the record at once, and those two roles disagree
# unless the difference is written down. A gate listed here with no job behind it
# used to read exactly like a gate that runs on every pipeline, so the parity
# check could never pass and the claim "both platforms implement the same gates"
# could never be true.
#
# `implemented` means a repository-owned script runs and both platforms call it;
# parity requires the job to exist on every platform the gate does not explicitly
# excuse itself from. `planned` means the gate is designed but nothing runs yet;
# parity requires it to have no job anywhere, so a half-built gate cannot pass as
# a real one, and `why_planned` records what is missing. Promoting a gate is
# therefore one field change plus the job it now demands.

version: 2

# Tier gates cost. `fast` runs on literally every pipeline; `standard` adds the
# checks a merge must not skip; `deep` holds everything that needs an unpinnable
# host, a nightly toolchain, or minutes measured in tens.
tiers:
  fast:
    description: Runs on every pipeline, including draft pushes and merge queue entries.
    events: [pull_request, push, merge_group, schedule, workflow_dispatch, tag, web, api]
  standard:
    description: Runs on anything that can become main, plus every deep pipeline.
    events: [pull_request, push, merge_group, schedule, workflow_dispatch, tag]
  deep:
    description: >-
      Scheduled and manually dispatched only. Holds the nightly-toolchain gates,
      the KVM host gate, and the multi-minute analyses.
    events: [schedule, workflow_dispatch, web, api]

# Change scopes. `plan-pipeline.sh` classifies every changed path into one or
# more of these, and a gate runs when any of its declared scopes is present.
scopes:
  always:
    description: Never filtered out.
    patterns: []
  rust:
    description: Rust sources, workspace manifests, the lockfile, or the toolchain pin.
    patterns:
      - "crates/"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".config/"
      - "deny.toml"
  lean:
    description: Lean sources, the Lean toolchain pin, or the differential corpus drivers.
    patterns:
      - "lean/"
      - "scripts/check-authority-corpus.sh"
      - "scripts/check-runtime-corpus.sh"
  docs:
    description: Documentation tree and its conventions.
    patterns:
      - "docs/"
  pipeline:
    description: Pipeline definitions, CI scripts, the gate manifest, and policy files.
    patterns:
      - ".github/"
      - ".gitlab/"
      - ".gitlab-ci.yml"
      - "ci/"
      - "scripts/ci/"
      - ".semgrep.yml"
      - "CODEOWNERS"

# Every workspace member, in the order the test shards are numbered. Adding a
# crate here is what creates its shard; `check-pipeline-parity.sh` proves the
# list still equals `[workspace].members`.
packages:
  - authority-core
  - capfs
  - egress-broker
  - egress-protocol
  - firecracker-runtime
  - runtime-isolation
  - session-orchestrator
  - supervisor

matrices:
  # One shard per crate. Deterministic, and a failing shard names the crate.
  test_shards:
    source: packages

  # Each crate checked on its own, outside the workspace feature unification
  # that hides a missing dependency when a sibling happens to enable it.
  isolation_packages:
    source: packages

  # `cargo check` does not link the final Rust binaries, but native build scripts
  # (notably ring's C/assembly boundary) still need a target C compiler. Keep the
  # Debian package and compiler name beside the triple so both CI platforms use
  # the same toolchain contract. deny.toml carries the same triples for its
  # advisory graph.
  cross_targets:
    values:
      - triple: aarch64-unknown-linux-gnu
        cc: aarch64-linux-gnu-gcc
        linker: aarch64-linux-gnu-gcc
        debian_package: gcc-aarch64-linux-gnu
        why: Non-x86 host support for the supervisor and authority kernel.
      - triple: x86_64-unknown-linux-musl
        cc: musl-gcc
        linker: musl-gcc
        debian_package: musl-tools
        why: Static-linkage target; catches glibc-only assumptions in the syscall layer.

  # Miri interprets Rust; it cannot execute the real syscalls that the isolation
  # and runtime crates exist to make. Only the crates whose unsafe code is pure
  # memory work are listed, and that boundary is documented in docs/ci-cd.md.
  miri_packages:
    values:
      - package: authority-core
        filter: capability::tests
        why: Pure capability matching and delegation invariants run under Miri isolation.
      - package: authority-core
        filter: file::tests
        why: Pure file-authority containment and effect-set invariants run under Miri isolation.
      - package: authority-core
        filter: github::tests
        why: Pure GitHub authority containment and branch grammar run under Miri isolation.
      - package: authority-core
        filter: http::tests
        why: Pure canonical host, URL, and HTTP authority checks run under Miri isolation.
      - package: authority-core
        filter: path::tests
        why: Pure canonical repository path and pattern checks run under Miri isolation.
      - package: authority-core
        filter: policy::tests
        why: Pure policy digest encoding and stability checks run under Miri isolation.
      - package: authority-core
        filter: repository::tests
        why: Pure repository identity checks run under Miri isolation.
      - package: authority-core
        filter: state::tests
        why: Pure capability state transition checks run under Miri isolation.
      - package: authority-core
        filter: time::tests
        why: Pure time-window containment checks run under Miri isolation.
      - package: egress-protocol
        filter: budget::tests
        why: Pure budget accounting and exhaustion checks run under Miri isolation.
      - package: egress-protocol
        filter: cbor::tests
        why: Canonical CBOR decoding of untrusted bytes runs under Miri isolation.
      - package: egress-protocol
        filter: frame::tests
        why: Length-prefixed frame validation runs under Miri isolation.
      - package: egress-protocol
        filter: operation::tests
        why: Closed operation conversion checks run under Miri isolation.
      - package: egress-protocol
        filter: session::tests
        why: Session replay and payload-hash checks run under Miri isolation.

  # LeakSanitizer is implied by AddressSanitizer; ThreadSanitizer needs an
  # instrumented std (`-Zbuild-std`) and is deliberately not run here.
  sanitizer_modes:
    values:
      - mode: address
        package: egress-protocol
      - mode: leak
        package: egress-protocol

  # libFuzzer targets live in the separate root fuzz workspace. Its committed
  # lockfile and seed corpora keep the bounded CI runs reproducible.
  fuzz_targets:
    values:
      - package: egress-protocol
        target: frame_decode
      - package: egress-protocol
        target: cbor_request_decode
      - package: authority-core
        target: canonical_path

  # cargo-mutants over the decision kernel, split so a full run fits the timeout.
  mutation_shards:
    values:
      - shard: 1
        package: authority-core
      - shard: 2
        package: egress-protocol

