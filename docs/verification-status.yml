    residual_reasons: []

  - id: egress-external-providers
    component: egress-broker
    scope: external
    status: blocked
    summary: Live GitHub installation credential use, provider mutation, and ref races remain outside deterministic provider doubles.
    verification_page: docs/egress-broker/verification.md
    prerequisites:
      - id: disposable-provider-credentials
        description: A disposable repository and least-privilege GitHub installation credential are required for the destructive smoke.
        check: scripts/ci/verify-live-github.sh environment
    gate:
      id: egress-external-providers
      result: required
      on_prerequisite_failure: fail
      commands:
        - scripts/ci/verify-live-github.sh
    evidence:
      commands:
        - scripts/ci/verify-live-github.sh
      sources:
        - crates/egress-broker/src/public_fetch.rs
        - crates/egress-broker/src/github.rs
      tests:
        - crates/egress-broker/src/public_fetch.rs
    residual_reasons:
      - No live GitHub installation credential, provider mutation, or ref race is exercised in the available environment.

  - id: repository-independent-review
    component: session-orchestrator
    scope: external
    status: blocked
    summary: A protected gate can verify a repository-external Ed25519-signed, exact-revision review report and zero open critical/high findings, but no independent reviewer report is available in this working tree.
    verification_page: docs/hardening/2026-08-18-completion-ledger.md
    prerequisites:
      - id: external-reviewer-attestation
        description: A genuinely independent reviewer must sign the complete-repository report, and the protected environment must supply its separately pinned public-key fingerprint.
        check: scripts/ci/verify-external-review.sh prerequisites
    gate:
      id: external_review_attestation
      result: required
      on_prerequisite_failure: fail
      commands:
        - scripts/ci/run.sh external-review
    evidence:
      commands:
        - scripts/ci/verify-external-review.sh
      sources:
        - scripts/ci/verify-external-review.sh
        - scripts/ci/verify-external-review-from-env.sh
      tests:
        - scripts/ci/tests/test-external-review.sh
    residual_reasons:
      - Repository-owned automation cannot independently review itself; a revision-bound external signature has not been supplied.

  - id: egress-privileged-public-https
    component: egress-broker
    scope: privileged
    status: verified
    summary: The required isolated transport gate exercises the real system DNS and HTTPS/TLS/SNI path, address pinning, and rebinding rejection against a controlled disposable endpoint; it is not Internet-provider evidence.
    verification_page: docs/egress-broker/verification.md
    prerequisites:
      - id: isolated-network-namespace
        description: Root, a private network namespace, loopback addresses, and OpenSSL are available for the controlled endpoint.
        check: scripts/ci/verify-real-public-https.sh prerequisites
    gate:
      id: egress-privileged-public-https
      result: required
      on_prerequisite_failure: fail
      commands:
        - scripts/ci/verify-real-public-https.sh
    evidence:
      commands:
        - scripts/ci/verify-real-public-https.sh
      sources:
        - crates/egress-broker/src/public_fetch.rs
      tests:
        - crates/egress-broker/tests/real_public_https.rs
    residual_reasons: []

  - id: egress-broker-supervisor-dispatch
    component: egress-broker
    scope: kvm
    status: verified
    summary: One production KVM lifecycle drives the supervisor-issued file capability through all CapFS effects, then sends the identity-bound request through isolation to Broker dispatch and durably records its canonical authorization rejection.
    verification_page: docs/egress-broker/verification.md
    prerequisites:
      - id: guest-capability-wiring
        description: Guest supervisor, CapFS, isolation launcher, and Broker must share one controlled runtime image.
        check: end-to-end guest capability dispatch scenario
    gate:
      id: egress-broker-supervisor-dispatch
      result: required
      on_prerequisite_failure: fail
      commands:
        - scripts/ci/verify-real-guest-control.sh
        - scripts/ci/verify-real-session-owner.sh
    evidence:
      commands:
        - scripts/ci/verify-real-guest-control.sh
        - scripts/ci/verify-real-session-owner.sh
      sources:
        - crates/egress-broker/src/dispatch.rs
        - crates/supervisor/src/supervisor.rs
      tests:
        - crates/firecracker-runtime/tests/real_guest_control.rs
        - crates/session-orchestrator/tests/real_production_lifecycle.rs
    residual_reasons: []

  - id: runtime-isolation-hosted
    component: runtime-isolation
    scope: hosted
    status: verified
