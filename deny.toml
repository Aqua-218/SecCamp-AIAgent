[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
]
exceptions = [
  { allow = ["AGPL-3.0-only"], crate = "authority-core" },
  { allow = ["AGPL-3.0-only"], crate = "ai-agent-fuzz" },
  { allow = ["AGPL-3.0-only"], crate = "capfs" },
  { allow = ["AGPL-3.0-only"], crate = "egress-broker" },
  { allow = ["AGPL-3.0-only"], crate = "egress-protocol" },
  { allow = ["AGPL-3.0-only"], crate = "firecracker-runtime" },
  { allow = ["AGPL-3.0-only"], crate = "runtime-isolation" },
  { allow = ["AGPL-3.0-only"], crate = "session-orchestrator" },
  { allow = ["AGPL-3.0-only"], crate = "supervisor" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
