    residual_reasons:
      - The aarch64 syscall table cross-checks successfully, but the required privileged aarch64 kernel gate has not produced evidence in this working tree.

  - id: runtime-isolation-adversarial-soak
    component: runtime-isolation
    scope: privileged
    status: verified
    summary: The real privileged envelope denied a bounded high-risk raw-syscall corpus before and after exec and completed twenty full isolation, rollback, cleanup, and residue-check iterations on x86_64.
    verification_page: docs/runtime-isolation/verification.md
    prerequisites:
